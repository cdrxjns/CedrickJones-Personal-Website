<!DOCTYPE html> <!-- Tells the browser that this is an HTML5 document -->
<html>
<head>
    <!-- The title that appears in the browser tab -->
    <title>JONES, CEDRICK A.</title>  
    
    <!-- Internal CSS styling -->
    <style>
        table {
            border-collapse: collapse; /* Removes double borders */
            width: 30%;               /* Table width is 30% of the page */
            margin: 20px auto;        /* Centers the table horizontally */
        }
        th, td {
            border: 1px solid black;  /* Adds border to cells */
            padding: 20px;            /* Adds spacing inside cells */
            text-align: center;       /* Centers the text inside cells */
        }
    </style>
</head>

<!-- Body starts here, background color set using HEX -->
<body bgcolor="#FFB22C">

    <!-- Page Heading -->
    <h2><center>MULTIPLICATION TABLE</center></h2>
    <br>

    <!-- Start of the table -->
    <table>
        <!-- Table Header (top row) -->
        <thead>
            <tr>
                <th>X</th> <!-- Top-left label -->
                <th>1</th>
                <th>2</th>
                <th>3</th>
                <th>4</th>
                <th>5</th>
            </tr>
        </thead>

        <!-- Table Body (main content) -->
        <tbody>
            <tr>
                <th>1</th> <!-- First column (row label) -->
                <td>1</td>
                <td>2</td>
                <td>3</td>
                <td>4</td>
                <td>5</td>
            </tr>
            <tr>
                <th>2</th>
                <td>2</td>
                <td>4</td>
                <td>6</td>
                <td>8</td>
                <td>10</td>
            </tr>
            <tr>
                <th>3</th>
                <td>3</td>
                <td>6</td>
                <td>9</td>
                <td>12</td>
                <td>15</td>
            </tr>
            <tr>
                <th>4</th>
                <td>4</td>
                <td>8</td>
                <td>12</td>
                <td>16</td>
                <td>20</td>
            </tr>
            <tr>
                <th>5</th>
                <td>5</td>
                <td>10</td>
                <td>15</td>
                <td>20</td>
                <td>25</td>
            </tr>
        </tbody>
    </table>
    <!-- End of Table -->

</body>
</html>
